<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title">
<title id="title">João Victor. Software engineer. Edge cases included.</title>
<style>
@font-face { font-family: 'SG'; font-weight: 500 700; src: url(data:font/woff2;base64,) format('woff2'); }
